<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://nominatim.openstreetmap.org; img-src 'self' data:;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Drizzl Weather</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face {
  font-family: 'Bricolage Grotesque';
  font-style: normal; font-weight: 400;
  font-display: swap;
  src: url('fonts/bricolage-grotesque-latin-400-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Bricolage Grotesque';
  font-style: normal; font-weight: 600;
  font-display: swap;
  src: url('fonts/bricolage-grotesque-latin-600-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'Bricolage Grotesque';
  font-style: normal; font-weight: 700;
  font-display: swap;
  src: url('fonts/bricolage-grotesque-latin-700-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal; font-weight: 300;
  font-display: swap;
  src: url('fonts/dm-sans-latin-300-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal; font-weight: 400;
  font-display: swap;
  src: url('fonts/dm-sans-latin-400-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal; font-weight: 500;
  font-display: swap;
  src: url('fonts/dm-sans-latin-500-normal.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal; font-weight: 600;
  font-display: swap;
  src: url('fonts/dm-sans-latin-600-normal.woff2') format('woff2');
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-card: rgba(0,0,0,0.4);
  --bg-card-hover: rgba(0,0,0,0.5);
  --text-primary: #f0f0f0;
  --text-secondary: rgba(240,240,240,0.75);
  --text-dim: rgba(240,240,240,0.5);
  --accent: #60a5fa;
  --accent-warm: #fbbf24;
  --accent-cool: #818cf8;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Bricolage Grotesque', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html { font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Atmospheric background ── */
#atmosphere {
  position: fixed; inset: 0; z-index: 0;
  transition: background 1.5s ease;
}
body { transition: background 1.5s ease; }
/* Card/chip overrides for light-background periods */
.atmos-day .card { --bg-card: rgba(0,0,0,0.3); }
.atmos-day .current-details span { background: rgba(0,0,0,0.3); }
.atmos-day .hour-chip { background: rgba(0,0,0,0.2); }
.atmos-day .hour-chip.now { background: rgba(0,0,0,0.35); }
.atmos-dawn .card { --bg-card: rgba(0,0,0,0.3); }
.atmos-dawn .current-details span { background: rgba(0,0,0,0.3); }
.atmos-overcast .card { --bg-card: rgba(0,0,0,0.45); }
/* Rain/snow keep fixed gradients */
.atmos-rain   { background: linear-gradient(170deg, #1e293b 0%, #334155 50%, #475569 100%); }
.atmos-snow   { background: linear-gradient(170deg, #cbd5e1 0%, #e2e8f0 50%, #f1f5f9 100%); }
.atmos-snow .card { --bg-card: rgba(0,0,0,0.3); }
.atmos-snow { --text-primary: #1e293b; --text-secondary: rgba(30,41,59,0.65); --text-dim: rgba(30,41,59,0.4); }

/* ── App shell ── */
#app {
  position: relative; z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 24px);
  min-height: 100vh; min-height: 100dvh;
}

/* ── Header / Location bar ── */
.header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px;
}
.header h1 {
  font-family: var(--font-display);
  font-size: 1.1rem; font-weight: 600;
  flex-shrink: 0; opacity: 0.9;
  letter-spacing: -0.02em;
}
.header-spacer { flex: 1; }
.icon-btn {
  background: var(--bg-card); border: none; color: var(--text-primary);
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.2rem;
  transition: background 0.2s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg-card-hover); }
.icon-btn.active { background: rgba(96,165,250,0.3); }

/* ── Next astronomical event (anchored to top of current-location) ── */
.astro-event {
  position: absolute;
  top: 0;
  right: 0;
  width: 120px;
  text-align: center;
  z-index: 5;
  user-select: none;
  font-family: var(--font-body);
  letter-spacing: normal;
}
.astro-event > summary { list-style: none; cursor: pointer; }
.astro-event > summary::-webkit-details-marker { display: none; }
.astro-circle {
  width: 56px;
  height: 56px;
  margin: 0 auto;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.28);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  line-height: 1;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px -6px rgba(0,0,0,0.35);
}
.astro-name {
  font-size: 0.72rem;
  font-weight: 600;
  margin-top: 6px;
  color: var(--text-primary);
  line-height: 1.25;
}
.astro-when {
  font-size: 0.7rem;
  font-weight: 400;
  color: var(--text-secondary);
  line-height: 1.25;
}
.astro-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: min(300px, calc(100vw - 32px));
  max-height: 60vh;
  overflow-y: auto;
  text-align: left;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: rgba(15,23,42,0.92);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 12px 32px -8px rgba(0,0,0,0.5);
  color: #f1f5f9;
}
.astro-panel-title {
  font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; opacity: 0.7; margin-bottom: 6px;
}
.astro-panel ul { list-style: none; margin: 0; padding: 0; }
.astro-row { border-top: 1px solid rgba(255,255,255,0.08); }
.astro-row-link { display: flex; gap: 10px; padding: 7px 0; color: inherit; text-decoration: none; align-items: flex-start; }
.astro-row-link:active { background: rgba(255,255,255,0.06); }
.astro-row-go { margin-left: auto; padding-left: 6px; font-size: 0.85rem; opacity: 0.5; line-height: 1.6; }
.astro-row:first-child { border-top: none; }
.astro-row.featured .astro-row-name { color: #93c5fd; }
.astro-row-icon { font-size: 1.2rem; line-height: 1.3; width: 24px; text-align: center; flex-shrink: 0; }
.astro-row-body { display: flex; flex-direction: column; min-width: 0; }
.astro-row-name { font-size: 0.85rem; font-weight: 600; }
.astro-row-when { font-size: 0.75rem; opacity: 0.85; }
.astro-row-when em { font-style: normal; opacity: 0.7; }
.astro-row-note { font-size: 0.7rem; opacity: 0.6; }
/* Reserve right-edge space so the location text doesn't slide under the event badge. */
.current-location, .current-region, .current-localtime {
  padding-right: 120px;
}

/* ── Location search overlay ── */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  display: none; flex-direction: column;
  padding: calc(var(--safe-top) + 16px) 16px 16px;
}
.overlay.open { display: flex; }
.search-box {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.search-box input {
  flex: 1; padding: 12px 16px; border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.15); color: var(--text-primary);
  font-family: var(--font-body); font-size: 1rem;
  outline: none;
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { border-color: var(--accent); }
.search-results, .fav-list {
  list-style: none;
  overflow-y: auto;
}
.overlay-scroll {
  flex: 1; overflow-y: auto;
}
.search-results li, .fav-list li {
  padding: 8px 16px; border-radius: var(--radius-sm);
  cursor: pointer; display: flex; align-items: center; gap: 10px;
  transition: background 0.15s;
}
.search-results li:hover, .fav-list li:hover { background: rgba(255,255,255,0.15); }
.fav-list li .fav-name { flex: 1; }
.fav-list li .fav-remove {
  opacity: 0.4; cursor: pointer; font-size: 1.1rem; padding: 4px;
}
.fav-list li .fav-remove:hover { opacity: 1; }
.section-label {
  font-size: 1.2rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-dim);
  padding: 8px 0 4px;
}

/* ── Cards ── */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.card-title {
  font-family: var(--font-display);
  font-size: 1.1rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-secondary);
  margin-bottom: 14px;
}

/* ── Current conditions ── */
.current-location {
  position: relative;
  font-family: var(--font-display);
  font-size: 1.5rem; font-weight: 700;
  margin-bottom: 2px; letter-spacing: -0.02em;
}
.current-region {
  font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px;
}
.current-localtime {
  font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px;
  font-variant-numeric: tabular-nums;
}
.current-main {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 4px;
}
.current-temp {
  font-family: var(--font-display);
  font-size: 4.5rem; font-weight: 700;
  line-height: 1; letter-spacing: -0.04em;
}
.current-temp sup { font-size: 2rem; font-weight: 400; }
.current-hilo {
  font-size: 1.15rem; font-weight: 500;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
  margin-bottom: 16px;
}
.current-hilo .sep { opacity: 0.5; margin: 0 6px; }
.current-icon { font-size: 4rem; line-height: 1; }
.current-details {
  display: flex; flex-wrap: wrap; gap: 8px;
  font-size: 1rem; color: var(--text-secondary);
}
.current-details span {
  background: rgba(255,255,255,0.15);
  padding: 6px 12px; border-radius: 20px;
}
.current-desc {
  font-size: 1.15rem; margin-bottom: 12px; font-weight: 400;
}

/* ── Hourly scroll ── */
.hourly-scroll {
  display: flex; gap: 4px;
  overflow-x: auto; margin: 0 -20px; padding: 0 20px 8px;
  scrollbar-width: none;
}
.hourly-scroll::-webkit-scrollbar { display: none; }
.hour-chip {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  font-size: 0.95rem; min-width: 72px;
  background: rgba(255,255,255,0.12);
  transition: background 0.15s;
}
.hour-chip.now { background: rgba(96,165,250,0.3); }
.hour-chip .h-time { color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; }
.hour-chip .h-icon { font-size: 1.5rem; }
.hour-chip .h-temp { font-weight: 600; font-size: 1.05rem; }
.hour-chip .h-precip { font-size: 0.85rem; color: #b3d4fc; }
.hour-chip .h-wind { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }

/* ── Daily forecast ── */
.daily-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.25);
}
.daily-row:last-child { border-bottom: none; }
.daily-row { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.daily-row:active { background: rgba(255,255,255,0.08); }

/* ── Day hours panel (tap a 10-day row) ── */
.day-sheet {
  position: fixed; inset: 0; z-index: 110;
  background: rgba(0,0,0,0.2); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.day-sheet.open { display: flex; }
/* The panel is an ordinary .card (theme colours and all), sized like the
   cards in #app; only the close button is extra. */
.day-sheet .card { width: 100%; max-width: 448px; margin: 0; }
.day-sheet .card-title { display: flex; align-items: baseline; }
.day-sheet-close {
  margin-left: auto; background: none; border: none; padding: 0 2px;
  color: var(--text-secondary); font-size: 1.1rem; line-height: 1; cursor: pointer;
}
.daily-day { width: 48px; font-size: 1rem; font-weight: 600; }
.daily-day-date { font-size: 0.72rem; color: var(--text-dim); font-weight: 400; }
.card-title-date { font-size: 0.78rem; color: var(--text-dim); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }
.daily-icon { font-size: 1.5rem; width: 36px; text-align: center; }
.daily-precip { font-size: 0.9rem; color: #b3d4fc; width: 40px; text-align: right; }
.daily-wind { font-size: 0.85rem; color: var(--text-primary); width: 60px; text-align: right; white-space: nowrap; }
.daily-bar-wrap { flex: 1; display: flex; align-items: center; gap: 8px; }
.daily-lo { font-size: 0.95rem; color: var(--text-secondary); width: 32px; text-align: right; }
.daily-hi { font-size: 0.95rem; font-weight: 700; width: 32px; }
.daily-bar {
  flex: 1; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.2);
  position: relative; overflow: hidden;
}
.daily-bar-fill {
  position: absolute; top: 0; height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-warm));
}

/* ── Daylight graph ── */
.daylight-graph {
  position: relative;
  width: 100%;
}
.daylight-graph svg {
  width: 100%; height: auto;
  display: block;
}
.daylight-summary {
  display: flex; justify-content: center; gap: 24px;
  padding-top: 14px; margin-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 1.1rem; color: var(--text-secondary);
}
.daylight-summary span { font-weight: 500; color: var(--text-primary); }
.moon-row {
  display: flex; align-items: center; gap: 14px;
  padding-top: 14px; margin-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.moon-disc {
  width: 40px; height: 40px; border-radius: 50%;
  position: relative; overflow: hidden;
  background: #e8e8d0;
  flex-shrink: 0;
  box-shadow: 0 0 10px rgba(255,255,200,0.15);
}
.moon-shadow {
  position: absolute; top: 0; height: 100%;
  background: #1a1a2e;
  transition: all 0.3s;
}
.moon-info { flex: 1; }
.moon-name { font-size: 1.2rem; font-weight: 500; }
.moon-illum { font-size: 1.05rem; color: var(--text-secondary); }
.moon-graph {
  position: relative;
  width: 100%;
}
.moon-graph svg {
  width: 100%; height: auto;
  display: block;
}
.moon-summary {
  display: flex; justify-content: center; gap: 24px;
  padding-top: 14px; margin-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.1);
  font-size: 1.1rem; color: var(--text-secondary);
}
.moon-summary span { font-weight: 500; color: var(--text-primary); }

/* ── Wind details ── */
.wind-details {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
}
.detail-item { text-align: center; }
.detail-value { font-size: 1.3rem; font-weight: 600; font-family: var(--font-display); }
.detail-label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
.detail-icon { font-size: 1.4rem; margin-bottom: 4px; }

/* ── Loading / Error ── */
.loading {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 60vh; gap: 16px;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-secondary); font-size: 0.9rem; }
.error-msg {
  text-align: center; padding: 40px 20px;
  color: var(--text-secondary);
}
.error-msg button {
  margin-top: 12px; padding: 10px 24px;
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); cursor: pointer;
  font-family: var(--font-body); font-weight: 500;
}

/* ── Transitions ── */
.fade-in { animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ── Updated timestamp ── */
.updated {
  text-align: center; font-size: 0.75rem;
  color: var(--text-dim); padding: 16px 0 0;
}
</style>
</head>
<body>

<div id="atmosphere"></div>

<div id="app">
  <header class="header">
    <h1>☂ Drizzl</h1>
    <div class="header-spacer"></div>
    <button class="icon-btn" id="btnGeo" title="Use my location">📍</button>
    <button class="icon-btn" id="btnFav" title="Toggle favourite">☆</button>
    <button class="icon-btn" id="btnSearch" title="Search / Favourites">☰</button>
  </header>
  <main id="main">
    <div class="loading"><div class="spinner"></div><div class="loading-text">Fetching weather…</div></div>
  </main>
</div>

<!-- Day hours panel -->
<div class="day-sheet" id="daySheet">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="daySheetTitle">
    <div class="card-title"><span id="daySheetTitle"></span><button class="day-sheet-close" id="closeDaySheet" aria-label="Close">✕</button></div>
    <div class="hourly-scroll" id="daySheetHours"></div>
  </div>
</div>

<!-- Search / Favourites overlay -->
<div class="overlay" id="overlay">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search city or town…" autocomplete="off">
  </div>
  <div class="overlay-scroll">
    <div class="section-label" id="resultsLabel" style="display:none">Results</div>
    <ul class="search-results" id="searchResults"></ul>
    <div class="section-label" id="favsLabel">Favourites</div>
    <ul class="fav-list" id="favList"></ul>
    <div style="padding:16px 0; text-align:center;">
      <button class="icon-btn" id="closeOverlay" style="width:auto;padding:10px 24px;border-radius:var(--radius-sm);font-size:0.9rem;">Close</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  Drizzl Weather — Open-Meteo PWA
// ═══════════════════════════════════════════

// --- Retired address: Drizzl moved from GitHub Pages to Cloudflare. -------
// Both sites build from the same main, so the old one detects itself, shows a
// link to the new address instead of the app, and removes only Drizzl's own
// service worker and caches (powejam.github.io is one origin shared by all the
// apps under it). Remove this block once GitHub Pages is switched off.
function showMovedNotice() {
  var NEW_HOME = "https://drizzl.powejam.com/";
  document.title = "Drizzl has moved";
  var wrap = document.createElement("div");
  wrap.setAttribute("style", "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;" +
    "justify-content:center;padding:16px;overflow:auto;background:#0b1118;color:#eef3f8;" +
    "font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5");
  var card = document.createElement("div");
  card.setAttribute("style", "max-width:420px;width:100%;background:#16212d;border:1px solid #2a3a4b;" +
    "border-radius:16px;padding:22px 20px");
  var h = document.createElement("h1");
  h.setAttribute("style", "font-size:20px;margin:0 0 8px");
  h.textContent = "Drizzl has moved";
  var p = document.createElement("p");
  p.setAttribute("style", "margin:0 0 16px;color:#c4d0dc");
  p.textContent = "This address is being retired. Drizzl now lives at drizzl.powejam.com.";
  var a = document.createElement("a");

function loadState() {

    if (f) state.favourites = JSON.parse(f);
    if (a) state.activeLocation = JSON.parse(a);
  } catch(e) {}
}
function saveState() {
  try {
    localStorage.setItem('drizzl_favs', JSON.stringify(state.favourites));

// ── IndexedDB mirror ──
// localStorage alone has proved unreliable for saved locations on the phone
// (lost across a restart). IndexedDB commits transactionally, so every save is
// mirrored there, and on launch it restores the locations if localStorage
// comes back without them. localStorage stays authoritative whenever its keys
// exist, so a deliberately emptied favourites list ('[]') is not resurrected.
const IDB_NAME = 'drizzl', IDB_STORE = 'kv', IDB_KEY = 'state';
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSaveState() {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite', {durability: 'strict'});
      tx.objectStore(IDB_STORE).put({favourites: state.favourites, activeLocation: state.activeLocation}, IDB_KEY);
      tx.oncomplete = resolve;
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
    db.close();
  } catch (e) {}
}
async function idbRestoreState() {
  let hasFavs = false, hasActive = false;
  try {
    hasFavs = localStorage.getItem('drizzl_favs') !== null;
    hasActive = localStorage.getItem('drizzl_active') !== null;
  } catch (e) {}
  if (hasFavs && hasActive) return;
  try {
    const db = await idbOpen();
    const saved = await new Promise((resolve, reject) => {
      const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    db.close();
    if (!saved) return;
    if (!hasFavs && Array.isArray(saved.favourites)) state.favourites = saved.favourites;
    if (!hasActive && saved.activeLocation) state.activeLocation = saved.activeLocation;
  } catch (e) {}
}

const _D2R = Math.PI / 180;

function _lunationArgs(k) {

    - 0.00024*E*_sin(2*Mp-M) - 0.00017*_sin(Om) - 0.00007*_sin(Mp+2*M)
    + 0.00004*_sin(2*Mp-2*F) + 0.00004*_sin(3*M) + 0.00003*_sin(Mp+M-2*F)

// Ch. 54 — eclipse at lunation k (integer = solar, +0.5 = lunar), or null.
// Returns {jde, kind} where kind is e.g. 'total', 'annular', 'hybrid',

function eclipseAt(k) {
  const {T, jde, E, M, Mp, F, Om} = _lunationArgs(k);
  if (Math.abs(_sin(F)) > 0.36) return null;
  const lunar = Math.abs(k % 1) > 0.25;
  const F1 = F - 0.02665*_sin(Om);
  const A1 = 299.77 + 0.107408*k - 0.009173*T*T;

    + (lunar ? -0.4065*_sin(Mp) + 0.1727*E*_sin(M) : -0.4075*_sin(Mp) + 0.1721*E*_sin(M))
    + 0.0161*_sin(2*Mp) - 0.0097*_sin(2*F1) + 0.0073*E*_sin(Mp-M) - 0.0050*E*_sin(Mp+M)
    - 0.0023*_sin(Mp-2*F1) + 0.0021*E*_sin(2*M) + 0.0012*_sin(Mp+2*F1)
    + 0.0006*E*_sin(2*Mp+M) - 0.0004*_sin(3*Mp) - 0.0003*E*_sin(M+2*F1)
    + 0.0003*_sin(A1) - 0.0002*E*_sin(M-2*F1) - 0.0002*E*_sin(2*Mp-M) - 0.0002*_sin(Om);
  const P = 0.2070*E*_sin(M) + 0.0024*E*_sin(2*M) - 0.0392*_sin(Mp) + 0.0116*_sin(2*Mp)
    - 0.0073*E*_sin(Mp+M) + 0.0067*E*_sin(Mp-M) + 0.0118*_sin(2*F1);
  const Q = 5.2207 - 0.0048*E*_cos(M) + 0.0020*E*_cos(2*M) - 0.3299*_cos(Mp)
    - 0.0060*E*_cos(Mp+M) + 0.0041*E*_cos(Mp-M);

  const u = 0.0059 + 0.0046*E*_cos(M) - 0.0182*_cos(Mp) + 0.0004*_cos(2*Mp) - 0.0005*_cos(M+Mp);
  const ag = Math.abs(g);

    const umb = (1.0128 - u - ag) / 0.5450;

    return {jde: t, kind: umb >= 1 ? 'total' : umb > 0 ? 'partial' : 'penumbral', mag: umb > 0 ? umb : pen};

    return {jde: t, kind: u < 0 ? 'total' : u > w ? 'annular' : 'hybrid', gamma: g};
